# nginx config for the single-container Dokploy deploy.
# Identical site logic to nginx.conf but upstreams are localhost node services
# and both server blocks serve from /srv instead of /usr/share/nginx.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # ---- Marketing website (storyframe.yamu.app) ----
    server {
        listen 80 default_server;
        server_name storyframe.yamu.app;
        root /srv/website;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

        # Strict static asset handling (prevents index.html SPA fallback on missing CSS/JS)
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
        }

        # Static media and fonts
        location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1M;
            add_header Cache-Control "public";
        }

        # Community API (same process, localhost upstream)
        set $community http://127.0.0.1:9183;
        location /api/ideas {
            proxy_pass $community;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 8k;
        }
        location /roadmap/ideas/ {
            proxy_pass $community;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        set $creation http://127.0.0.1:9184;
        location /api/ {
            proxy_pass $creation;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            client_max_body_size 50m;
        }
        location /templates/ {
            proxy_pass $creation;
            proxy_set_header Host $host;
        }
        location = /sitemap.xml { proxy_pass $creation; }
        location = /gallery { return 301 /tutorials; }
        location = /gallery/ { return 301 /tutorials; }
        location = /guides { return 301 /docs; }
        location = /guides/ { return 301 /docs; }
        location = /community.html { return 404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
        location / {
            try_files $uri $uri/index.html =404;
        }
    }

    # ---- Studio SPA (studio.storyframe.yamu.app) ----
    server {
        listen 80;
        server_name studio.storyframe.yamu.app storyframe-studio.yamu.app;
        root /srv/web;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
        }

        location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1M;
            add_header Cache-Control "public";
        }

        set $brag http://127.0.0.1:9184;
        location /api/ {
            proxy_pass $brag;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            client_max_body_size 50m;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
