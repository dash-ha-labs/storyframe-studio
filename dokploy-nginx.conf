# nginx server blocks for the single-container Dokploy deploy.
# Installed as /etc/nginx/http.d/default.conf (included inside the http
# context by the nginx alpine image's top-level nginx.conf).
# Upstreams are the co-located node services on localhost.

# ---- Marketing website (storyframe.yamu.app) ----
server {
    listen 80 default_server;
    server_name storyframe.yamu.app;
    root /app/srv/website;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Strict static asset handling (prevents index.html SPA fallback on missing CSS/JS)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Static media and fonts
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
    }

    # Community API (same container, localhost upstream)
    set $community http://127.0.0.1:9183;
    location /api/ideas {
        proxy_pass $community;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }
    location /roadmap/ideas/ {
        proxy_pass $community;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    set $creation http://127.0.0.1:9184;
    location /api/ {
        proxy_pass $creation;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }
    location /templates/ {
        proxy_pass $creation;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml { proxy_pass $creation; }
    location = /gallery { return 301 /tutorials; }
    location = /gallery/ { return 301 /tutorials; }
    location = /guides { return 301 /docs; }
    location = /guides/ { return 301 /docs; }
    location = /community.html { return 404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri/index.html =404;
    }
}

# ---- Studio SPA (studio.storyframe.yamu.app) ----
server {
    listen 80;
    server_name studio.storyframe.yamu.app storyframe-studio.yamu.app;
    root /app/srv/web;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
    }

    set $brag http://127.0.0.1:9184;
    location /api/ {
        proxy_pass $brag;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # SPA fallback for page routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
