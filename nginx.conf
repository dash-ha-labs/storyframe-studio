server {
    listen 80 default_server;
    server_name storyframe.yamu.app;
    root /usr/share/nginx/website;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression for static text/css/js
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Strict static asset handling (prevents index.html SPA fallback on missing CSS/JS)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Static media and fonts
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
    }

    # SPA fallback for page routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

