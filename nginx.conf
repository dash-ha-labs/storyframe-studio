server {
    listen 80 default_server;
    server_name storyframe.yamu.app;
    root /usr/share/nginx/website;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression for static text/css/js
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Strict static asset handling (prevents index.html SPA fallback on missing CSS/JS)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Static media and fonts
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
    }

    # Website community data is a separate service and volume from Studio.
    # Runtime DNS lookup lets the static website start independently.
    resolver 127.0.0.11 valid=30s;
    set $community http://website-community:9183;
    location /api/ {
        proxy_pass $community;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }
    location /roadmap/ideas/ {
        proxy_pass $community;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /gallery { return 301 /tutorials; }
    location = /gallery/ { return 301 /tutorials; }
    location = /guides { return 301 /docs; }
    location = /guides/ { return 301 /docs; }
    location = /community.html { return 404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri/index.html =404;
    }
}

server {
    listen 80;
    server_name studio.storyframe.yamu.app storyframe-studio.yamu.app;
    root /usr/share/nginx/web;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression for static text/css/js
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Strict static asset handling (prevents index.html SPA fallback on missing CSS/JS)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Static media and fonts
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1M;
        add_header Cache-Control "public";
    }

    # SPA fallback for page routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
